name: iOS

# Builds the iPhone app on a Mac and runs the food recogniser on an iOS
# simulator. The unsigned .ipa it uploads can be installed with your own Apple
# ID (docs/IOS.md).

on:
  push:
    paths: ['ios/**', 'packages/**', 'lib/**', 'integration_test/**', 'pubspec.*', 'tool/food_model/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'packages/**', 'lib/**', 'integration_test/**', 'pubspec.*', 'tool/food_model/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    name: Food recogniser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Convert the model
        run: |
          pip install -r tool/food_model/requirements.txt
          python tool/food_model/convert.py --out assets/models --cache /tmp/food_model
      - uses: actions/upload-artifact@v4
        with:
          name: food-model
          path: assets/models/pronexa-food-v1.*
          retention-days: 3

  ios:
    name: iPhone app
    needs: model
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: food-model
          path: assets/models
      - name: Use the newest Xcode (plugins need the iOS 26 SDK)
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - name: Run the recogniser on an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1])]
          runtimes = sorted((r for r in devices if "iOS" in r), key=version, reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"
      - name: Build for iPhone (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package an unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Pronexa-unsigned.ipa Payload
          du -h Pronexa-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: pronexa-ios-unsigned
          path: Pronexa-unsigned.ipa
          retention-days: 14
