name: Web app

# Builds the Pronexa PWA (with the photo recogniser) and publishes it on
# GitHub Pages at https://<owner>.github.io/<repo>/.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['lib/**', 'web/**', 'assets/**', 'pubspec.*', 'tool/web/**', 'tool/food_model/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the PWA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the on-device food recogniser
        run: |
          pip install -r tool/food_model/requirements.txt
          python tool/food_model/convert.py --out assets/models --cache /tmp/food_model
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Build
        env:
          PRONEXA_AI_URL: ${{ vars.PRONEXA_AI_URL }}
        run: tool/web/build.sh "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
