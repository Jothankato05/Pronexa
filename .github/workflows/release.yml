name: Release

# Builds signed APKs and publishes them on a GitHub Release.
# Run it by pushing a tag (git tag v0.6.0 && git push origin v0.6.0) or from
# the Actions tab ("Run workflow"). Needs four repository secrets, see
# docs/RELEASING.md. Optional repository variable PRONEXA_AI_URL builds the
# app with the AI reader server's address.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.6.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.PRONEXA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PRONEXA_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Add the PRONEXA_* signing secrets first (docs/RELEASING.md)."
            exit 1
          fi
      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.PRONEXA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/pronexa-upload.jks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - name: Tests
        run: flutter test
      - name: Build signed APKs
        env:
          PRONEXA_KEYSTORE: pronexa-upload.jks
          PRONEXA_STORE_PASSWORD: ${{ secrets.PRONEXA_STORE_PASSWORD }}
          PRONEXA_KEY_ALIAS: ${{ secrets.PRONEXA_KEY_ALIAS }}
          PRONEXA_KEY_PASSWORD: ${{ secrets.PRONEXA_KEY_PASSWORD }}
          AI_URL: ${{ vars.PRONEXA_AI_URL }}
        run: |
          DEFINE=""
          if [ -n "$AI_URL" ]; then DEFINE="--dart-define=PRONEXA_AI_URL=$AI_URL"; fi
          flutter build apk --release -P force-version-code-ignoring-abi=true $DEFINE
          cp build/app/outputs/flutter-apk/app-release.apk "Pronexa-${TAG#v}.apk"
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 -P force-version-code-ignoring-abi=true $DEFINE
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "Pronexa-${TAG#v}-small.apk"
          sha256sum Pronexa-*.apk > SHA256SUMS.txt
      - name: Remove keystore
        if: always()
        run: rm -f android/pronexa-upload.jks
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Pronexa ${{ env.TAG }}
          body: |
            **The `-small` APK**: most Android phones (Tecno, Infinix, itel, Samsung A). Try this first.
            **The other APK**: every phone. Use it if the small one says "App not installed". Either one updates the other.

            Android 7.0 or newer. Allow "Install unknown apps" for your browser or file manager, then open the file. Checksums are in SHA256SUMS.txt.
          files: |
            Pronexa-*.apk
            SHA256SUMS.txt
