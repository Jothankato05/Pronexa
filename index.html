<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pronexa: making every meal count</title>
    <meta name="description" content="Check if you're getting enough protein from Nigerian meals you already eat, and find affordable ways to close the gap. Works offline." />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      /* Paint something calm instantly, before any JS arrives (no blank screens on slow networks). */
      html, body { margin: 0; background: #faf7f2; }
      #app:empty::before {
        content: ''; display: block; max-width: 432px; height: 360px; margin: 88px auto 0; border-radius: 30px;
        background: linear-gradient(90deg, #f2ece3 25%, #f8f4ee 50%, #f2ece3 75%); background-size: 200% 100%;
        animation: s 1.3s linear infinite;
      }
      @keyframes s { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { #app:empty::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Pronexa needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
